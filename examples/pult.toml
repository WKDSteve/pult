# pult profile: which inputs go to which buses. Start with
#   pult run --profile examples\pult.toml
# Device names may be a unique part of the name (see `pult devices`).

# Buffering per input in milliseconds (1 to 2000). Raise it if you hear dropouts.
latency_ms = 40

# A bus is a mix played on one output device; every input is resampled to its rate.
[[bus]]
name = "A1"
device = "Focusrite"

# A second output, for example headphones on another device; remove it if you have none.
# [[bus]]
# name = "A2"
# device = "Kopfhörer"
# gain_db = -6

# Everything Windows plays into the virtual cable.
[[input]]
device = "CABLE Output"
buses = ["A1"]

# The sound of one program instead of a device (see `pult programs`); remove the # to try.
# [[input]]
# process = "Spotify"
# buses = ["A1"]
# gain_db = -3

# The Scarlett's own inputs (microphone, guitar), quieter and muted to start with.
[[input]]
device = "Analogue 1 + 2"
buses = ["A1"]
gain_db = -6
mute = true

# A scene changes values while the route runs (`scene abend`), without opening a device and
# without a dropout. It names only what differs; remove the # to try.
# [[scene]]
# name = "abend"
# blend_ms = 500             # how long the change takes
#
# [[scene.input]]
# input = 2                  # the second [[input]] above
# gain_db = -12
# mute = false
#
# [[scene.bus]]
# bus = "A1"
# gain_db = -6
