# pult profile: which inputs go to which buses. Start with
#   pult run --profile examples\pult.toml
# Device names may be a unique part of the name (see `pult devices`).

# Buffering per input in milliseconds (1 to 2000). Raise it if you hear dropouts.
latency_ms = 40

# A bus is a mix played on one output device; every input is resampled to its rate.
[[bus]]
name = "A1"
device = "Focusrite"

# Its limiter is on from the start and keeps what leaves the bus below -0.3 dB, and the sound
# leaves 1 ms later for it. Remove the # to change that.
# limit_on = false
# limit_db = -3              # -20 to 0
# limit_lookahead_ms = 0     # 0 to 5: 0 adds no delay, but meets a peak with a step

# Its equalizer has four bands, flat to start with: a low shelf at 100 Hz, bells at 500 and
# 2500 Hz, a high shelf at 8 kHz. Name only what differs; remove the # to try.
# [[bus.eq]]
# band = 1
# gain_db = 3                # a little more bass
#
# [[bus.eq]]
# band = 3
# kind = "bell"              # low, bell or high
# freq_hz = 3000
# gain_db = -2
# q = 1.4                    # higher is narrower

# A second output, for example headphones on another device; remove it if you have none.
# [[bus]]
# name = "A2"
# device = "Kopfhörer"
# gain_db = -6

# Everything Windows plays into the virtual cable.
[[input]]
device = "CABLE Output"
buses = ["A1"]

# The sound of one program instead of a device (see `pult programs`); remove the # to try.
# [[input]]
# process = "Spotify"
# buses = ["A1"]
# gain_db = -3

# The Scarlett's own inputs (microphone, guitar), quieter and muted to start with.
[[input]]
device = "Analogue 1 + 2"
buses = ["A1"]
gain_db = -6
mute = true
# A gate keeps it quiet between words, a compressor evens out its level and makes it louder:
# one knob each, 0 (off) to 10. Remove the # to try.
# gate = 3
# comp = 4

# A scene changes values while the route runs (`scene abend`), without opening a device and
# without a dropout. It names only what differs; remove the # to try.
# [[scene]]
# name = "abend"
# blend_ms = 500             # how long the change takes
#
# [[scene.input]]
# input = 2                  # the second [[input]] above
# gain_db = -12
# mute = false
# comp = 4                   # also gate
#
# [[scene.bus]]
# bus = "A1"
# gain_db = -6
#
# [[scene.bus.eq]]           # also eq_on above, to switch all bands
# band = 1
# gain_db = 3
