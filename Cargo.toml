[workspace]
resolver = "3"
members = ["crates/pult-core", "crates/pult-engine", "crates/pult-cli", "crates/pult-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
authors = ["Stefan Bartl"]
repository = "https://github.com/WKDSteve/pult"
publish = false

[workspace.dependencies]
pult-core = { path = "crates/pult-core" }
pult-engine = { path = "crates/pult-engine" }
cpal = "0.18.2"
rtrb = "0.4.1"
assert_no_alloc = "1.1.2"
crossterm = { version = "0.29.0", default-features = false, features = ["events", "windows"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = { version = "1.1.8", default-features = false, features = ["std", "serde", "parse"] }
# Process loopback (pult-engine `ffi`); the versions cpal already uses.
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_Multimedia",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_Security",
] }
windows-core = "0.62.2"

[workspace.lints.rust]
# Denied everywhere; only pult-engine's `ffi` module (process loopback) allows it, and the
# other crates forbid it outright.
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Sample math converts between frame counts and float on purpose.
cast_precision_loss = "allow"

[profile.release]
lto = "thin"
codegen-units = 1

# The audio callbacks must keep up in debug builds too.
[profile.dev.package."*"]
opt-level = 2
