[workspace]
resolver = "3"
members = [
    "crates/pult-core",
    "crates/pult-engine",
    "crates/pult-hub",
    "crates/pult-midi",
    "crates/pult-cli",
    "crates/pult-app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
authors = ["Stefan Bartl"]
repository = "https://github.com/WKDSteve/pult"
publish = false

[workspace.dependencies]
pult-core = { path = "crates/pult-core" }
pult-engine = { path = "crates/pult-engine" }
pult-hub = { path = "crates/pult-hub" }
pult-midi = { path = "crates/pult-midi" }
# The kit the local hubs of all these apps are built on, pinned by its tag.
appkit-core = { git = "https://github.com/WKDSteve/appkit", tag = "v0.44.1" }
appkit-hub = { git = "https://github.com/WKDSteve/appkit", tag = "v0.44.1" }
appkit-testkit = { git = "https://github.com/WKDSteve/appkit", tag = "v0.44.1" }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
serde_json = "1"
cpal = "0.18.2"
rtrb = "0.4.1"
# Loudness after ITU-R BS.1770 / EBU R128 (LUFS, LRA, true peak), measured outside the callbacks.
ebur128 = "0.1"
assert_no_alloc = "1.1.2"
crossterm = { version = "0.29.0", default-features = false, features = ["events", "windows"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = { version = "1.1.8", default-features = false, features = ["std", "serde", "parse"] }
toml_edit = { version = "0.25.17", default-features = false, features = ["parse", "display"] }
# Process loopback (pult-engine `ffi`); the versions cpal already uses.
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_Multimedia",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_Security",
] }
windows-core = "0.62.2"

[workspace.lints.rust]
# Denied everywhere; only the `ffi` modules allow it: pult-engine's (process loopback, realtime
# priority, the session mark) and that of the pult-app binary (console, one instance, start with
# Windows). The other crates, and the library of pult-app, forbid it outright.
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Sample math converts between frame counts and float on purpose.
cast_precision_loss = "allow"

[profile.release]
lto = "thin"
codegen-units = 1

# The audio callbacks must keep up in debug builds too.
[profile.dev.package."*"]
opt-level = 2
