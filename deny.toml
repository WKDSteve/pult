# cargo-deny: what may enter the dependency tree (NREL-01).
# Run: cargo deny check

[graph]
all-features = false
# Every system pult is built for: Windows, and Linux and macOS, which the CI compiles too.
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu", "aarch64-apple-darwin"]

[advisories]
# Known vulnerabilities and unmaintained crates are errors.
unmaintained = "all"
yanked = "deny"
ignore = [
    # zvariant, zvariant_derive, zbus_names: unmaintained (2026-10-16). Linux only: eframe ->
    # egui-winit -> accesskit_winit -> accesskit_unix (AT-SPI over D-Bus), and tray-icon -> ksni.
    # No replacement yet; they are named in .cargo/audit.toml and ci.yml too.
    "RUSTSEC-2026-0370",
    "RUSTSEC-2026-0371",
    "RUSTSEC-2026-0372",
]

[licenses]
confidence-threshold = 0.9
# Only licenses the tree has; a new one is a decision, not a default.
allow = [
    "MIT",
    "Apache-2.0",
    "Unicode-3.0",
    # pult-hub, through appkit-hub: matchit (the router of axum) is MIT AND BSD-3-Clause, and
    # notify (the file watcher of the kit) is CC0-1.0, a public domain dedication.
    "BSD-3-Clause",
    "CC0-1.0",
    # assert_no_alloc (the allocation guard of the audio callbacks): permissive, notice only.
    "BSD-1-Clause",
    # pult-app (egui, wgpu): foldhash and others under Zlib, libloading under ISC; both
    # permissive, notice only.
    "Zlib",
    "ISC",
    # pult-app: egui's built-in fonts (epaint_default_fonts), shipped inside the binary. Both
    # allow embedding and redistribution; the font may not be sold on its own.
    "OFL-1.1",
    "Ubuntu-font-1.0",
    # pult-app on Linux: ksni (the tray over D-Bus), a public domain dedication like CC0.
    "Unlicense",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# The hub kit of the family, pinned by its tag (crates/pult-hub).
allow-git = ["https://github.com/WKDSteve/appkit"]
