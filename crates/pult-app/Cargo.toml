[package]
name = "pult-app"
description = "The window of pult: a mixing console on screen"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

# Owned by the interface strand (stage 3b): its dependencies (eframe, egui) go here, not into the
# workspace's Cargo.toml. The console sees the mixer only through pult_core::view; main.rs opens
# the engine's desk behind it.

[[bin]]
name = "pult-app"
path = "src/main.rs"

[dependencies]
pult-core.workspace = true
# The engine behind the window (EngineDesk); the window still sees it only as a pult_core Desk.
pult-engine.workspace = true
# Debug builds use its checking allocator, as the command line does.
assert_no_alloc.workspace = true
# The same UI stack as takt (egui over eframe, wgpu); glow, x11 and wayland stay out.
# src/ffi.rs: AttachConsole, so a release build without a console window can still answer
# --help in the terminal it was started from; a named mutex and event, so a second start shows
# the running window instead of starting a second route; the Run value of the start with
# Windows.
windows = { workspace = true, features = [
    "Win32_System_Console",
    "Win32_System_Registry",
    "Win32_UI_WindowsAndMessaging",
] }
# The settings of the window (src/settings.rs), read and written; profiles are only read.
serde.workspace = true
toml = { workspace = true, features = ["display"] }
# The icon in the notification area (stage 3 UI): the window hides there and the route keeps
# playing. Without default features: those only pull in the Linux tray (libappindicator, GTK).
tray-icon = { version = "0.26.1", default-features = false }
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "default_fonts", "wgpu"] }

[dev-dependencies]
# Renders views offscreen through wgpu and compares them with tests/snapshots/*.png.
egui_kittest = { version = "0.37.0", features = ["wgpu", "snapshot"] }

[lints]
workspace = true
