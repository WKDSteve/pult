# cargo-audit reads the whole Cargo.lock, every platform; cargo-deny (deny.toml) checks
# only the Windows graph pult is built for. Advisories ignored here reach Cargo.lock but
# not that graph; each names its path. Drop an entry once its crate leaves Cargo.lock or a
# build for its platform is planned.

[advisories]
ignore = [
    # zvariant, zvariant_derive, zbus_names: unmaintained (2026-10-16). Linux only:
    # eframe -> egui-winit -> accesskit_winit -> accesskit_unix (AT-SPI over D-Bus).
    "RUSTSEC-2026-0370",
    "RUSTSEC-2026-0371",
    "RUSTSEC-2026-0372",
]
