# CI of pult.
#
# Runs on a self-hosted runner (the author's Windows machine), by choice: the repository is
# private, and Linux is reached through its WSL. Without a running runner a push stays "Queued". No
# `pull_request` trigger on purpose: a pull request would run its own workflow with the author's
# rights on this machine.
#
# Tools (rustup, cargo-audit, cargo-deny, python, node, pnpm, Chrome) are expected on the PATH and
# print their versions; the Rust toolchain is the one rust-toolchain.toml names, so local builds and CI use
# the same. The tests need no audio device: everything device-free lives in pult-core.

name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# `shell: bash` resolves to the WSL launcher on this machine; Git Bash is named explicitly, in
# 8.3 form because the shell string is split at spaces.
defaults:
  run:
    shell: C:\PROGRA~1\Git\bin\bash.exe --noprofile --norc -e -o pipefail {0}

jobs:
  rust:
    runs-on: [self-hosted, windows]
    timeout-minutes: 30
    steps:
      # Actions are pinned by commit; the comment names the tag.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (node24)
        with:
          persist-credentials: false
      # Installs the toolchain of rust-toolchain.toml when it is missing, then names it.
      - run: rustup show active-toolchain || rustup toolchain install
      - run: rustc --version && cargo --version && cargo audit --version && cargo deny --version
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # pult-app's snapshot tests render through wgpu on this machine's GPU (or WARP).
      - run: cargo test --workspace --locked
      # A snapshot that does not match leaves <name>.new.png and <name>.diff.png beside it.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (node24)
        with:
          name: snapshot-diffs
          path: |
            crates/pult-app/tests/snapshots/*.new.png
            crates/pult-app/tests/snapshots/*.diff.png
          if-no-files-found: ignore
      # The supply chain: known advisories, licenses, sources. The three ignored advisories
      # (zvariant, zbus_names, zvariant_derive unmaintained) reach the lock file only through
      # the Linux build: accesskit_unix (eframe's screen reader bridge) and ksni (the tray).
      - run: >-
          cargo audit --deny warnings
          --ignore RUSTSEC-2026-0370 --ignore RUSTSEC-2026-0371 --ignore RUSTSEC-2026-0372
      - run: cargo deny check

  # pult is meant to work on Linux and macOS as on Windows. Linux runs for real in the WSL of this
  # machine (its tests need no audio device; the build stays in the home of the WSL, off the slow
  # way to the Windows disk). macOS is only compiled, since no such machine is here.
  other-systems:
    runs-on: [self-hosted, windows]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (node24)
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - run: rustup target add aarch64-apple-darwin
      - run: cargo clippy --workspace --all-targets --locked --target aarch64-apple-darwin -- -D warnings
      - run: >-
          wsl.exe -d archlinux --cd "$(pwd -W)" -- bash -lc
          'export CARGO_TARGET_DIR=$HOME/.cache/pult-ci-target;
          cargo clippy --workspace --all-targets --locked -- -D warnings &&
          cargo test --workspace --locked'

  # The remote control page in the Chrome of this machine against the demo hub, which touches no audio device:
  # pairing, controls, refusals, the policy, and axe in light and dark (any violation is red). Playwright and axe
  # come at fixed versions from tools/page-check, with node and pnpm from the PATH; pult has no other Node part.
  page:
    runs-on: [self-hosted, windows]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (node24)
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - run: node --version && pnpm --version
      - run: pnpm --dir tools/page-check install --frozen-lockfile
      - run: cargo build -p pult-hub --example demo-hub --locked
      - run: node tools/page-check.mjs tools/page-check/node_modules target/debug/examples/demo-hub.exe
      # The test sheets (TESTS/sheets, .testing.lua) at a fixed version of testing.nvim; --strict: a sheet that could
      # not run is red here, this job exists to prove it. nvim comes from the PATH.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (node24)
        with:
          repository: WKDSteve/testing.nvim
          ref: baecaba4260920b43810bc344c3e68968979a947
          path: .deps/testing.nvim
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (node24)
        with:
          repository: WKDSteve/lib.nvim
          ref: e2653cad3479a976e610049fe91fde2116810ae3
          path: .deps/lib.nvim
          persist-credentials: false
      - run: nvim -n -i NONE --headless -u NONE -l .deps/testing.nvim/scripts/testing.lua sheets run --all --root . --strict
        env:
          LIB_NVIM_DIR: ${{ github.workspace }}/.deps/lib.nvim

  # A control or invisible character in a tracked text file is refused; the tool tests itself.
  hygiene:
    runs-on: [self-hosted, windows]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (node24)
        with:
          persist-credentials: false
      - run: python -m unittest discover tools
      - run: python tools/check-control-chars.py
      # Every colour of the remote control page comes from palette.css (generated from the icon by the app icons
      # tool of the tasks vault); a hex colour or a colour function in any other stylesheet is refused. Copy of
      # appkit's tool.
      - run: python tools/check-color-literals.py --root crates/pult-hub/ui --tokens crates/pult-hub/ui/palette.css
      # The rules the workflows must keep (pins, runner, rights, a release stays a draft).
      - run: python tools/check-workflows.py
      # The release zip from stand-ins for the programs, and its install and uninstall into temp places.
      - run: pwsh -NoProfile -File scripts/test-release.ps1
