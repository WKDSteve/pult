# CI of pult.
#
# Runs on a self-hosted runner (the author's Windows machine), by choice: the repository is
# private and pult is Windows-only (WASAPI). Without a running runner a push stays "Queued". No
# `pull_request` trigger on purpose: a pull request would run its own workflow with the author's
# rights on this machine.
#
# Tools (rustup, cargo-audit, cargo-deny, python) are expected on the PATH and print their
# versions; the Rust toolchain is the one rust-toolchain.toml names, so local builds and CI use
# the same. The tests need no audio device: everything device-free lives in pult-core.

name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# `shell: bash` resolves to the WSL launcher on this machine; Git Bash is named explicitly, in
# 8.3 form because the shell string is split at spaces.
defaults:
  run:
    shell: C:\PROGRA~1\Git\bin\bash.exe --noprofile --norc -e -o pipefail {0}

jobs:
  rust:
    runs-on: [self-hosted, windows]
    timeout-minutes: 30
    steps:
      # Actions are pinned by commit; the comment names the tag.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (node24)
        with:
          persist-credentials: false
      # Installs the toolchain of rust-toolchain.toml when it is missing, then names it.
      - run: rustup show active-toolchain || rustup toolchain install
      - run: rustc --version && cargo --version && cargo audit --version && cargo deny --version
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # pult-app's snapshot tests render through wgpu on this machine's GPU (or WARP).
      - run: cargo test --workspace --locked
      # A snapshot that does not match leaves <name>.new.png and <name>.diff.png beside it.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (node24)
        with:
          name: snapshot-diffs
          path: |
            crates/pult-app/tests/snapshots/*.new.png
            crates/pult-app/tests/snapshots/*.diff.png
          if-no-files-found: ignore
      # The supply chain: known advisories, licenses, sources. The three ignored advisories
      # (zvariant, zbus_names, zvariant_derive unmaintained) reach the lock file only through
      # accesskit_unix, eframe's Linux screen reader bridge, which is never built here; cargo
      # deny, scoped to the Windows target, does not see them at all.
      - run: >-
          cargo audit --deny warnings
          --ignore RUSTSEC-2026-0370 --ignore RUSTSEC-2026-0371 --ignore RUSTSEC-2026-0372
      - run: cargo deny check

  # A control or invisible character in a tracked text file is refused; the tool tests itself.
  hygiene:
    runs-on: [self-hosted, windows]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (node24)
        with:
          persist-credentials: false
      - run: python -m unittest discover tools
      - run: python tools/check-control-chars.py
      # Every colour of the remote control page comes from palette.css (generated from the icon by the app icons
      # tool of the tasks vault); a hex colour or a colour function in any other stylesheet is refused. Copy of
      # appkit's tool.
      - run: python tools/check-color-literals.py --root crates/pult-hub/ui --tokens crates/pult-hub/ui/palette.css
      # The rules the workflows must keep (pins, runner, rights, a release stays a draft).
      - run: python tools/check-workflows.py
      # The release zip from stand-ins for the programs, and its install and uninstall into temp places.
      - run: pwsh -NoProfile -File scripts/test-release.ps1
